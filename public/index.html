<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Grid Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Upload Section -->
        <div class="upload-section">
            <div class="upload-header">
                <h2>📸 Upload Media</h2>
                <p>Preview how your posts will look in Instagram grid (Images & Videos)</p>
            </div>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-content">
                    <div class="upload-icon">📁</div>
                    <p>Drag & drop images/videos here or click to browse</p>
                    <input type="file" id="fileInput" accept="image/*,video/*,.heic,.heif" multiple hidden>
                    <button class="browse-btn" onclick="document.getElementById('fileInput').click()">
                        Choose Files
                    </button>
                </div>
            </div>
            
            <div class="upload-progress" id="uploadProgress" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="progressText">Uploading...</p>
            </div>
        </div>

        <!-- Grid Preview Section -->
        <div class="preview-section">
            <div class="preview-header">
                <h2>📱 Instagram Grid Preview</h2>
                <p>Your feed preview (newest posts on the right)</p>
            </div>
            
            <div class="instagram-grid" id="instagramGrid">
                <!-- Grid items will be populated by JavaScript -->
            </div>
            
            <div class="loading-indicator" id="loadingIndicator" style="display: none;">
                <div class="spinner"></div>
                <p>Loading more images...</p>
            </div>
        </div>
    </div>

    <!-- Full View Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <div class="modal-actions">
                <button class="delete-btn" id="modalDeleteBtn">🗑️ Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
